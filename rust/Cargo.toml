[package]
name = "lightcone"
version = "0.9.2"
edition = "2021"
description = "Rust SDK for the Lightcone Protocol — unified native + WASM client"
license = "MIT"
repository = "https://github.com/lightcone-street/lightcone-sdk/tree/main/rust"
keywords = ["solana", "lightcone", "sdk", "impact-markets"]

[lib]
doctest = false

[dependencies]
# ── Core types (always available, WASM-safe) ──────────────────────────────────
solana-pubkey = { version = "3.0", features = ["serde"] }
solana-signature = { version = "3.1", features = ["verify"] }
solana-instruction = "3.1"
solana-transaction = { version = "3.0", features = ["serde", "bincode"] }
solana-hash = "4.0"
solana-sdk-ids = { version = "3.1", default-features = false }
solana-system-interface = { version = "3.0", default-features = false, features = ["bincode"] }
solana-program-pack = "3.0"

# Crypto (WASM-compatible)
sha3 = "0.10"
sha2 = "0.10"

# SPL (WASM-compatible)
spl-token = { version = "9.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0", features = ["no-entrypoint"] }
spl-token-interface = "2.0"
spl-associated-token-account-interface = "2.0"

# Serialization (WASM-compatible)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde_urlencoded = "0.7"

# Utilities (WASM-compatible)
thiserror = "2.0"
rust_decimal = { version = "1", features = ["serde-str"] }
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
bincode = "^1.3.3"
bs58 = "0.5"
hex = "0.4"
lazy_static = "1.5"
rand = "0.8"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# ── HTTP client (WASM-safe via reqwest's wasm support) ────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
async-lock = { version = "3.4", optional = true }
# The wasm-bindgen feature is load-bearing: without it, Delay::new calls
# std::time::Instant::now(), which panics at runtime on wasm32-unknown-unknown
# ("time not implemented on this platform") — with it, wasm builds use a
# setTimeout-backed timer (gloo) and native builds are unchanged.
futures-timer = { version = "3", optional = true, features = ["wasm-bindgen"] }

# ── Native-only dependencies ──────────────────────────────────────────────────
# Solana client (non-WASM)
solana-client = { version = "3.1", optional = true }
solana-commitment-config = { version = "3.1", optional = true }
solana-keypair = { version = "3.0", optional = true }
solana-signer = { version = "3.0", optional = true }
tokio = { version = "1.49", default-features = false, features = ["time", "net", "sync", "macros", "rt"], optional = true }

# WebSocket native
tokio-tungstenite = { version = "0.26", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }

# ── WASM-only dependencies ────────────────────────────────────────────────────
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }

# Async utilities (WASM-compatible)
async-stream = "0.3"
pin-project-lite = "0.2"

# uuid needs an explicit randomness source on wasm32-unknown-unknown; without
# this, the crate only compiles for wasm when the consumer enables uuid/js.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
solana-keypair = "3.0"
solana-signer = "3.0"
futures-util = "0.3"
bincode = "^1.3.3"

# ── Examples ─────────────────────────────────────────────────────────────────

[[example]]
name = "cancel_order"
required-features = ["native"]

[[example]]
name = "deposit_asset_prices"
required-features = ["native"]

[[example]]
name = "deposit_token_balances"
required-features = ["native"]

[[example]]
name = "faucet_claim"
required-features = ["native"]

[[example]]
name = "market_deposit_assets"
required-features = ["native"]

[[example]]
name = "metrics_all"
required-features = ["native"]

[[example]]
name = "global_deposit_withdrawal"
required-features = ["native"]

[[example]]
name = "login"
required-features = ["native"]

[[example]]
name = "markets"
required-features = ["native"]

[[example]]
name = "onchain_transactions"
required-features = ["native"]

[[example]]
name = "orderbook"
required-features = ["native"]

[[example]]
name = "orderbook_tickers"
required-features = ["native"]

[[example]]
name = "positions"
required-features = ["native"]

[[example]]
name = "price_history"
required-features = ["native"]

[[example]]
name = "price_history_consistency"
required-features = ["native"]

[[example]]
name = "read_onchain"
required-features = ["native"]

[[example]]
name = "rpc_failover"
required-features = ["native"]

[[example]]
name = "submit_order"
required-features = ["native"]

[[example]]
name = "trades"
