name: Test Examples

on:
  workflow_call:
    inputs:
      lightcone-env:
        required: true
        type: string
        description: "Target environment (staging or prod)"
    secrets:
      TRITON_DEVNET_RPC_URL:
        required: true
        description: "Authenticated Triton devnet RPC URL"
      TRITON_MAINNET_RPC_URL:
        required: true
        description: "Authenticated Triton mainnet RPC URL"

env:
  LIGHTCONE_ENV: ${{ inputs.lightcone-env }}

jobs:
  # Temporarily disable all stateful example CI. Every example job depends on
  # this gate, so keeping it skipped prevents backend checks and example runs.
  backend-ready:
    if: ${{ false }}
    name: Backend Ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for backend version match
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

  rust-examples:
    name: Rust Examples
    needs: backend-ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Configure paid RPC
        env:
          DEVNET_RPC_URL: ${{ secrets.TRITON_DEVNET_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.TRITON_MAINNET_RPC_URL }}
        run: |
          case "$LIGHTCONE_ENV" in
            staging) rpc_url="$DEVNET_RPC_URL" ;;
            prod) rpc_url="$MAINNET_RPC_URL" ;;
            *) echo "::error::Unsupported LIGHTCONE_ENV: $LIGHTCONE_ENV"; exit 1 ;;
          esac
          test -n "$rpc_url" || { echo "::error::Triton $LIGHTCONE_ENV RPC secret is not configured"; exit 1; }
          printf 'SDK_RPC_URL=%s\n' "$rpc_url" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      - name: Install cargo-cooldown
        run: cargo install --locked --version 0.2.0 cargo-cooldown

      - name: Check dependency cooldown
        run: cargo cooldown check

      - name: Point at dev + wait for backend version match
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk rs

  typescript-examples:
    name: TypeScript Examples
    needs: backend-ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - name: Configure paid RPC
        env:
          DEVNET_RPC_URL: ${{ secrets.TRITON_DEVNET_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.TRITON_MAINNET_RPC_URL }}
        run: |
          case "$LIGHTCONE_ENV" in
            staging) rpc_url="$DEVNET_RPC_URL" ;;
            prod) rpc_url="$MAINNET_RPC_URL" ;;
            *) echo "::error::Unsupported LIGHTCONE_ENV: $LIGHTCONE_ENV"; exit 1 ;;
          esac
          test -n "$rpc_url" || { echo "::error::Triton $LIGHTCONE_ENV RPC secret is not configured"; exit 1; }
          printf 'SDK_RPC_URL=%s\n' "$rpc_url" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm install

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR_TS }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH_TS=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      - name: Point at dev + wait for backend version match
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk ts

  python-examples:
    name: Python Examples
    needs: backend-ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Configure paid RPC
        env:
          DEVNET_RPC_URL: ${{ secrets.TRITON_DEVNET_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.TRITON_MAINNET_RPC_URL }}
        run: |
          case "$LIGHTCONE_ENV" in
            staging) rpc_url="$DEVNET_RPC_URL" ;;
            prod) rpc_url="$MAINNET_RPC_URL" ;;
            *) echo "::error::Unsupported LIGHTCONE_ENV: $LIGHTCONE_ENV"; exit 1 ;;
          esac
          test -n "$rpc_url" || { echo "::error::Triton $LIGHTCONE_ENV RPC secret is not configured"; exit 1; }
          printf 'SDK_RPC_URL=%s\n' "$rpc_url" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR_PYTHON }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH_PYTHON=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      - name: Point at dev + wait for backend version match
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk py
