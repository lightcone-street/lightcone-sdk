name: Test Examples

on:
  workflow_call:
    inputs:
      lightcone-env:
        required: true
        type: string
        description: "Target environment (staging or prod)"

env:
  LIGHTCONE_ENV: ${{ inputs.lightcone-env }}

jobs:
  rust-examples:
    name: Rust Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      - name: Install cargo-cooldown
        run: cargo install --locked --version 0.2.0 cargo-cooldown

      - name: Check dependency cooldown
        run: cargo cooldown check

      # Temporarily disabled: the strict dev==staging-HEAD equality blocks all SDK
      # merges whenever the backend's dev deploy lags staging (tracked in Linear,
      # DevOps project — re-enable once the gate is redesigned). Examples run
      # against the staging tier (the SDKs' LIGHTCONE_ENV=staging defaults).
      - name: Point at dev + wait for backend version match
        if: ${{ false }}
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk rs

  typescript-examples:
    name: TypeScript Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm install

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR_TS }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH_TS=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      # Temporarily disabled: the strict dev==staging-HEAD equality blocks all SDK
      # merges whenever the backend's dev deploy lags staging (tracked in Linear,
      # DevOps project — re-enable once the gate is redesigned). Examples run
      # against the staging tier (the SDKs' LIGHTCONE_ENV=staging defaults).
      - name: Point at dev + wait for backend version match
        if: ${{ false }}
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk ts

  python-examples:
    name: Python Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR_PYTHON }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH_PYTHON=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      # Temporarily disabled: the strict dev==staging-HEAD equality blocks all SDK
      # merges whenever the backend's dev deploy lags staging (tracked in Linear,
      # DevOps project — re-enable once the gate is redesigned). Examples run
      # against the staging tier (the SDKs' LIGHTCONE_ENV=staging defaults).
      - name: Point at dev + wait for backend version match
        if: ${{ false }}
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk py

  rescript-examples:
    name: ReScript Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install

      - name: Build (compile .res + gentype .gen.ts)
        run: ./node_modules/.bin/rescript build

      - name: Run unit tests
        run: bun test ./tests/*Test.res.mjs ./bindings/*/tests/*Test.res.mjs

      - name: Typecheck gentype output + TS examples
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Write wallet keypair
        env:
          CI_WALLET_KEYPAIR: ${{ secrets.CI_WALLET_KEYPAIR_RESCRIPT }}
        run: echo "$CI_WALLET_KEYPAIR" > "$RUNNER_TEMP/ci-wallet.json"

      - name: Set wallet path
        run: echo "LIGHTCONE_WALLET_PATH_RESCRIPT=$RUNNER_TEMP/ci-wallet.json" >> "$GITHUB_ENV"

      # Temporarily disabled: the strict dev==staging-HEAD equality blocks all SDK
      # merges whenever the backend's dev deploy lags staging (tracked in Linear,
      # DevOps project — re-enable once the gate is redesigned). Examples run
      # against the staging tier (the SDKs' LIGHTCONE_ENV=staging defaults).
      - name: Point at dev + wait for backend version match
        if: ${{ false }}
        uses: ./.github/actions/wait-for-dev
        with:
          lightcone-env: ${{ inputs.lightcone-env }}
          gh-token: ${{ secrets.LIGHTCONE_SDK_GH_CI }}

      - name: Run all examples
        working-directory: .
        run: ./scripts/run-examples.sh --sdk res
