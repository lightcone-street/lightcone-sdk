name: PR Check

on:
  pull_request:
    branches: [staging, prod]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust_tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Test example runner environment boundary
        working-directory: .
        run: ./scripts/run-examples.test.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-tests-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-tests-

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Check default and explicit RPC features
        run: |
          cargo check
          cargo check --features solana-rpc

      - name: Clippy
        run: cargo clippy --all-targets --features native,trigger_orders

      - name: Unit tests (native)
        run: cargo test --features native

      - name: Unit tests (native + trigger_orders)
        run: cargo test --features native,trigger_orders

      - name: Check web-facing WASM feature
        run: cargo check --no-default-features --features wasm,trigger_orders --target wasm32-unknown-unknown

  publish:
    needs: [rust_tests]
    if: ${{ always() && needs.rust_tests.result == 'success' }}
    uses: ./.github/workflows/publish.yml
    with:
      mode: dry-run
    secrets: inherit
