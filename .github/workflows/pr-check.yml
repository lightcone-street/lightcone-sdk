name: PR Check

on:
  pull_request:
    branches: [staging, prod]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust_tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Test release version promotion
        working-directory: .
        run: |
          bash .github/scripts/next-release-version.test.sh
          bash .github/scripts/bump-versions.test.sh

      - name: Test example runner environment boundary
        working-directory: .
        run: ./scripts/run-examples.test.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-tests-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-tests-

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Check default and explicit RPC features
        run: |
          cargo check
          cargo check --features solana-rpc

      - name: Clippy
        run: cargo clippy --all-targets --features native,trigger_orders

      - name: Unit tests (native)
        run: cargo test --features native

      - name: Unit tests (native + trigger_orders)
        run: cargo test --features native,trigger_orders

      - name: Check web-facing WASM feature
        run: cargo check --no-default-features --features wasm,trigger_orders --target wasm32-unknown-unknown

  typescript_tests:
    name: TypeScript Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck, and build
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:examples
          npm run build

      - name: Unit tests
        run: npm test

  python_tests:
    name: Python Checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --python "${{ matrix.python }}"

      - name: Check changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output([
              "git", "-C", "..", "diff", "--name-only", "--diff-filter=ACMR",
              os.environ["PR_BASE_SHA"], "HEAD", "--", "python",
          ], text=True).splitlines()
          files = [str(Path(path).relative_to("python")) for path in changed if path.endswith(".py")]
          if files:
              subprocess.run(["uv", "run", "--locked", "black", "--check", *files], check=True)
              subprocess.run(["uv", "run", "--locked", "ruff", "check", *files], check=True)
          PY

      - name: Unit tests
        run: uv run --locked pytest

  publish:
    needs: [rust_tests, typescript_tests, python_tests]
    if: ${{ always() && needs.rust_tests.result == 'success' && needs.typescript_tests.result == 'success' && needs.python_tests.result == 'success' }}
    uses: ./.github/workflows/publish.yml
    with:
      mode: dry-run
    secrets: inherit
