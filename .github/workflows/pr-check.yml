name: PR Check

on:
  pull_request:
    branches: [staging, prod]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust_tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-tests-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-tests-

      - name: Unit tests (native)
        run: cargo test --features native

      - name: Unit tests (native + trigger_orders)
        run: cargo test --features native,trigger_orders

  publish:
    needs: [rust_tests]
    if: ${{ always() && needs.rust_tests.result == 'success' }}
    uses: ./.github/workflows/publish.yml
    with:
      mode: dry-run
    secrets: inherit
