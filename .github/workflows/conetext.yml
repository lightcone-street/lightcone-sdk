name: Conetext Adoption

on:
  pull_request:
  push:
    branches: [main, staging, prod]

permissions:
  contents: read

jobs:
  validate-adoption:
    name: Validate Adoption
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate v0.1.0 shared guidance contract
        shell: bash
        run: |
          for path in .conetext-version AGENTS.md CLAUDE.md CONTEXT.md; do
            test -f "$path"
            test ! -L "$path"
          done
          test "$(cat .conetext-version)" = "0.1.0"
          test "$(cat CLAUDE.md)" = "@AGENTS.md"
          grep -q '[^[:space:]]' CONTEXT.md
          grep -Fq "conetext" AGENTS.md
          grep -Fq ".conetext-version" AGENTS.md
          grep -Fq "Developer instructions" AGENTS.md
