name: Wait for dev backend
description: >
  Block until api.dev.lightcone.xyz is running the current lightcone-backend `staging`
  HEAD, then point the SDK examples at the dev tier (SDK_API_URL / SDK_WS_URL). This is
  the cross-repo gate: the SDK is only tested once dev provably runs the backend it
  expects, so a not-yet-deployed backend can't produce a false pass/fail. No-op unless
  the target env is staging (prod PRs test against prod as before).
inputs:
  lightcone-env:
    required: true
    description: "staging or prod"
  gh-token:
    required: true
    description: "Token with read access to lightcone-street/lightcone-backend"
runs:
  using: composite
  steps:
    - if: inputs.lightcone-env == 'staging'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -euo pipefail
        EXPECTED=$(gh api repos/lightcone-street/lightcone-backend/commits/staging --jq .sha)
        echo "Waiting until api.dev runs backend $EXPECTED …"
        for i in $(seq 1 120); do            # ~40 min: backend build (~15-25m) + rollout
          GOT=$(curl -s -m 8 https://api.dev.lightcone.xyz/version || true)
          if [ "$GOT" = "$EXPECTED" ]; then echo "dev is on $GOT ✓"; break; fi
          echo "  dev on '${GOT:-?}', waiting… ($i/120)"; sleep 20
          if [ "$i" = 120 ]; then echo "timed out waiting for dev to reach $EXPECTED"; exit 1; fi
        done
        {
          echo "SDK_API_URL=https://api.dev.lightcone.xyz"
          echo "SDK_WS_URL=wss://ws.dev.lightcone.xyz/ws"
        } >> "$GITHUB_ENV"
